<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spartan Andorra · Goncas vs Borja</title>
<meta name="theme-color" content="#d0121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spartan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--card2:#f3f3f2;--line:#e3e3e0;--tx:#141414;--mut:#6a6a68;--ac:#39424a;--acbg:#eceff1;--red:#d0121b;--red2:#a30d14;--redbg:#fdeaea;--G:#1d5fd1;--G2:#7aa7ec;--B:#6f4222;--B2:#b08968;--acc:var(--red);--acc2:var(--red2);--good:#1a7f37;--bad:#b3121a;--warn:#8a5a00;--warnbg:#fff3d1;--n1:#6b46c1;--n2:#b0246f;--n3:#527a0a;--n4:#0f766e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.brand{font:800 19px/1 'Barlow Condensed',sans-serif;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
.brand span{color:var(--ac);margin:0 3px}
.brand.big{font-size:clamp(26px,8vw,40px);text-align:center;white-space:nowrap}
.top{padding:12px 2px 10px;position:sticky;top:0;background:var(--bg);z-index:5;margin:0 -14px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line);border-top:3px solid var(--ac)}
.cd{display:flex;align-items:center;gap:6px;margin-top:10px}
.cd-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin-right:4px}
.cd-b{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;background:#efede8;border-radius:8px;padding:5px 6px}
.cd-b b{font:800 22px/1 'Barlow Condensed',sans-serif;color:#3a3a38}
.cd-b span{font-size:11px;color:#77756f}
.cd-done{font-weight:700;color:var(--ac)}
.login .cd{margin:4px 0 6px}
.sub{color:var(--mut);font-size:12.5px;margin-top:3px}
.who{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;display:flex;gap:7px;align-items:center;font-weight:600;font-size:13px;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--acbg);border-color:var(--line);color:var(--tx);padding:10px 12px;border-radius:12px;margin:8px 0}
.hero .big-n{font-size:34px;margin:0}
.hero .lbl{font-size:10.5px}
.hero .chips{margin-top:6px;gap:5px}
.hero .chip{font-size:11.5px;padding:2px 8px}
.hero .warn{margin-top:6px;padding:5px 8px;font-size:12px}
.hero .lbl,.hero .mut{color:var(--mut)}
.hero .big-n small{color:var(--mut)}
.hero .chip{background:#fff;border-color:var(--line);color:var(--tx)}
.hero .chip b{color:var(--tx)}
.hero .chip.bad b{color:var(--bad)}.hero .chip.good b{color:var(--good)}
.hero .warn{background:#fff;color:var(--bad)}
.hero .info{background:#fff;color:var(--tx)}
.hero svg circle:first-child{stroke:#d9dde0}
.hero svg circle:last-child{stroke:var(--good)}
.hero.pulso{background:var(--card);border-color:var(--line);color:var(--tx)}
.hero.pulso .lbl,.hero.pulso .mut{color:var(--mut)}
.lbl{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.big-n{font:800 54px/1 'Barlow Condensed',sans-serif;margin:4px 0}
.big-n small{font-size:24px;color:var(--mut);font-weight:700}
.mut{color:var(--mut)} .sm{font-size:12.5px} .center{text-align:center} .fr{float:right}
.row{display:flex;align-items:center;gap:10px} .sb{justify-content:space-between}
.h{font:800 18px/1 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase;margin:22px 2px 6px;color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips.center{justify-content:center}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px;color:var(--mut)}
.chip b{color:var(--tx)} .chip.bad b{color:var(--bad)} .chip.good b{color:var(--good)}
.good{color:var(--good)} .bad{color:var(--bad)}
.warn{background:var(--redbg);color:var(--red2);font-weight:600;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
.info{background:var(--card2);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px;color:#3a3a38}
.note-bar{background:var(--warnbg);color:var(--warn);font-size:12.5px;padding:8px 10px;border-radius:10px;margin:8px 0 0}
.sc{padding:0;overflow:hidden;border-left:4px solid var(--lvc,var(--line))}
.sc.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line));border-left-color:var(--good)}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.sc-n{font:800 19px/1.15 'Barlow Condensed',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.sc-r{display:flex;align-items:center;gap:8px}
.chev{width:26px;height:26px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mut);font-weight:700}
.sc-b{padding:0 14px 12px;border-top:1px solid var(--line)}
.sc>.res{padding:0 14px 12px;margin:0}
.tgt{display:flex;flex-direction:column;background:var(--acbg);border-radius:12px;padding:10px 12px;margin:12px 0}
.adj{font-size:12px;color:var(--good);margin-top:4px}
.tgt b{font:800 26px/1.1 'Barlow Condensed',sans-serif;color:var(--tx)}
.blk{margin-top:10px} .blk p{margin:4px 0 0;color:#2c2c2a}
.blk ul,.sc-b ul{margin:4px 0 0;padding-left:18px;color:#2c2c2a} .blk li{margin:3px 0}
.bt{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-top:12px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.t-ok{background:color-mix(in srgb,var(--good) 14%,#fff);color:var(--good)}
.t-ex{background:#ececea;color:#3a3a38}
.t-cj{background:transparent;border:1px dashed var(--mut);color:#3a3a38}
.t-hoy{background:#141414;color:#fff}
.t-venc{background:color-mix(in srgb,var(--bad) 14%,#fff);color:var(--bad)}
.kc{font-weight:600} .k-c{color:var(--n1)} .k-f{color:var(--n2)} .k-h{color:var(--n3)} .k-m{color:var(--n4)} .k-p{color:#555}
.res{background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
.reg{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.card.reg{margin:10px 0}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}
input,select,textarea{background:#fff;border:1.5px solid #cfcfcc;border-radius:10px;padding:10px 11px;color:var(--tx);width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--line);font-weight:600}
.btn.sm{padding:8px 11px;font-size:13px}
.danger{color:var(--bad)!important}
.lnk{background:none;border:0;color:var(--ac);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.err{color:var(--bad);font-size:13px;min-height:0}
.daysel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.daysel select{width:auto;padding:7px 9px;font-size:14px}
.tabs{display:none;position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
.tabs button{flex:1;max-width:100px;background:none;border:0;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{color:var(--ac)}
.tabs .on::before{content:'';position:absolute;top:-7px;left:25%;right:25%;height:3px;background:var(--ac);border-radius:0 0 3px 3px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-top:8px}
.seg button{flex:1;background:none;border:0;padding:8px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer}
.seg .on{background:#fff;color:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cyc{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.cyc-t{font:800 20px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.nav{width:40px;height:40px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:22px;cursor:pointer}
.nav:disabled{opacity:.3}
.rival{border-left:4px solid var(--c)}
.pique{background:#fff;border:2px solid var(--c);border-radius:14px;padding:10px 12px;margin:6px 0;font-size:14px;animation:slideDown .4s ease-out}
.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:12px 0 10px;background:var(--line)}
.bar div{transition:width .6s}
.vs .big-n{font-size:46px}
.sc-t{width:100%;border-collapse:collapse;font-size:13.5px}
.sc-t td,.sc-t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.sc-t th{color:var(--mut);font-weight:600;font-size:12px}
.sc-t tr:last-child td{border:0}
.asalto{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.asalto:last-child{border:0}
.pqs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.keyd{list-style:none;padding:0;margin:0} .keyd li{padding:6px 0;border-bottom:1px solid var(--line)} .keyd li:last-child{border:0} .keyd b{display:inline-block;min-width:80px;color:var(--red2)}
.et.cur{border-color:var(--ac);border-width:2px}
.et .sc-h{padding:0}
.et .sc-b{border:0;padding:0}
.fbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px}
.flab{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.flab i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.kpis{margin-top:10px} .kpis div{background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.kpis b{font:800 18px/1.2 'Barlow Condensed',sans-serif}
details.tbl summary{cursor:pointer;color:var(--ac);font-weight:700;font-size:13.5px}
details table{width:100%;font-size:12.5px;border-collapse:collapse;margin-top:8px} details td{padding:5px 3px;border-bottom:1px solid var(--line)}
.rules{padding-left:18px;color:#2c2c2a;font-size:13.5px} .rules li{margin:5px 0}
.race{border-color:var(--red);border-width:2px}
.sm-card{padding:10px 14px;font-size:13.5px}
.login{min-height:85vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-top:40px}
.login p{text-align:center;margin:0 0 20px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 10px;font:800 26px/1 'Barlow Condensed',sans-serif;cursor:pointer;color:var(--c);text-transform:uppercase}
.pk.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pinf{display:flex;gap:8px;margin-top:12px} .pinf input{text-align:center;letter-spacing:.4em;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#141414;color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
sup{color:var(--mut)}
.mc-t{font:800 18px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.02em}
.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zl{stroke:var(--mut);stroke-width:1}
.chart .now{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 3}
.chart .ax{fill:var(--mut);font-size:10px;font-family:Inter,sans-serif}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mut);font-size:13px;padding:22px 0;text-align:center}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 6px}
.kt{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.kt .lbl{font-size:10px}
.kt b{font:800 21px/1.1 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:5px}
.kt .dot{width:7px;height:7px}
.mini-seg{display:inline-flex;background:var(--card2);border-radius:9px;padding:2px;margin-top:10px}
.mini-seg button{background:none;border:0;color:var(--mut);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.mini-seg .on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sm-chart{margin-top:12px}
.sm-t{font-size:12.5px;font-weight:600;color:#2c2c2a}
.hscroll{overflow-x:auto;margin-top:8px}
.htab{border-collapse:collapse;font-size:12.5px;width:100%;min-width:420px}
.htab td,.htab th{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.htab th{color:var(--mut);font-weight:600}
#tip{position:fixed;z-index:30;background:#141414;color:#fff;font-size:12.5px;font-weight:500;padding:7px 10px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip.on{opacity:1}

/* Menú */
.hr{display:flex;gap:6px;align-items:center;flex-shrink:0}
.top .row.sb{gap:6px;flex-wrap:nowrap}
.top .who{padding:6px 10px;font-size:12.5px}
.lvs+*,.reg .btn{margin-top:0}
.sc-b>.btn{margin-top:10px;width:100%}
.burger{width:38px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.burger svg{width:22px;height:22px;fill:none;stroke:var(--tx);stroke-width:2.4;stroke-linecap:round}
.burger.on{background:var(--ac);border-color:var(--ac)}.burger.on svg{stroke:#fff}
.drawer{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;animation:fadeUp .18s ease}
.drawer button{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:700;font-size:14px;color:var(--tx);cursor:pointer}
.drawer button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drawer .on{background:var(--ac);border-color:var(--ac);color:#fff}
.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.lvb{border:2px solid var(--c);background:#fff;border-radius:10px;padding:9px 0;font-weight:700;font-size:13px;cursor:pointer;color:var(--tx)}
.lvb.on{background:var(--c);color:#fff}
.lvb:nth-child(-n+2).on{color:#5a0a10}

/* Intensidad y esfuerzo */
.meter{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:6px}
.meter i{display:block;width:9px;height:9px;border-radius:2px}
.dl{background:var(--redbg);color:var(--red2);border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
.eff{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.ef{height:38px;border:0;border-radius:8px;background:var(--c);color:#fff;font:800 15px 'Barlow Condensed',sans-serif;cursor:pointer;opacity:.6;transition:transform .12s,opacity .12s;padding:0}
.ef:nth-child(-n+7){color:#5a0a10}
.ef.on{opacity:1;transform:scale(1.15);box-shadow:0 0 0 2px #141414;position:relative}

/* Desplegables */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;font-weight:700}
details.acc>summary::-webkit-details-marker{display:none}
.at{font:800 17px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;flex:1}
.as{color:var(--mut);font-size:12.5px;font-weight:500}
.chv{width:9px;height:9px;border-right:2.5px solid var(--ac);border-bottom:2.5px solid var(--ac);transform:rotate(45deg);transition:transform .2s;margin:0 4px 3px 2px}
details.acc[open]>summary .chv{transform:rotate(-135deg);margin-top:5px;margin-bottom:0}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
.ab{padding:4px 14px 14px}
.ab .card{border:0;padding:0;margin:0}
.ab .card.reg{margin:6px 0 0}
.sc-b details.acc{border-radius:12px;margin:8px 0}
.sc-b details.acc>summary{padding:10px 12px}
.sc-b .ab .reg{margin-top:4px}

/* Rueda de tiempo */
.wheel{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border-radius:12px;padding:10px 8px}
.wheel label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wheel select{width:92px;font:800 30px/1.1 'Barlow Condensed',sans-serif;text-align:center;text-align-last:center;padding:6px 4px;border-radius:10px;appearance:auto}
.wheel b{font:800 30px/1 'Barlow Condensed',sans-serif;color:var(--ac);margin-bottom:14px}

/* Avisos del compañero */
.evb{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ac);border-radius:14px;padding:10px 12px;margin:8px 0 0;font-size:14px;animation:slideDown .45s cubic-bezier(.2,.9,.3,1.2)}
.evb.ev-late{border-color:var(--bad);animation:slideDown .45s cubic-bezier(.2,.9,.3,1.2),shake .6s .45s}
.evi{font-size:20px} .evt{flex:1}

/* Animaciones */
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes ringin{from{stroke-dasharray:0 999}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
@keyframes cfade{from{opacity:0}to{opacity:1}}
main.enter>*{animation:fadeUp .28s ease-out both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}
main.enter .ring circle:last-child{animation:ringin .9s ease-out}
.cele{position:fixed;inset:0;z-index:50;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;animation:cfade .2s ease-out}
.cele-in{text-align:center;padding:20px}
.cele-ck{position:relative;width:110px;height:110px;margin:0 auto 14px}
.cele-ck svg{width:110px;height:110px;animation:pop .5s ease-out both}
.cele-ck circle{fill:var(--good);stroke:none}
.cele-ck path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .3s ease-out forwards}
.cele-ck i{position:absolute;left:50%;top:50%;width:8px;height:13px;border-radius:2px;background:var(--c);border:1px solid rgba(0,0,0,.08);animation:burst 1.1s ease-out forwards}
.cele-t{font:800 30px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;animation:fadeUp .4s .35s both}
.cele-s{color:var(--mut);margin-top:4px;animation:fadeUp .4s .45s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>
<script>
/* ===== LÓGICA DEL PLAN (sin interfaz) ===== */
const START = Date.UTC(2026, 10, 23); // lun 23 nov 2026: semana de prueba
const DAY = 864e5;
const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const NCYC = 13;
const RACE_DI = 194; // sáb 5 jun 2027
const RACEWEEK_DI = 189; // lun 31 may 2027
const NAMES = { G: 'Goncas', B: 'Borja' };
const PINS = { G: '2003', B: '2005' };
const OTHER = { G: 'B', B: 'G' };
const SIDS = ['s1', 's2', 's3', 's4', 's5', 's6', 's7'];
const DEF_DAYS = { s1: 1, s2: 3, s3: 5, s4: 7, s5: 9, s6: 11, s7: 13 };
const DELOAD = [3, 7, 10];

let TODAY_OVERRIDE = null;
function dateOf(di) { return new Date(START + di * DAY); }
function fd(di) { const d = dateOf(di); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; }
function todayDi() {
  if (TODAY_OVERRIDE !== null) return TODAY_OVERRIDE;
  const n = new Date();
  return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - START) / DAY);
}
function cyStart(c) { return 7 + 14 * (c - 1); }
function phase(di) {
  if (di < 0) return { k: 'pre' };
  if (di < 7) return { k: 'test', d: di + 1 };
  if (di < RACEWEEK_DI) { const c = Math.floor((di - 7) / 14) + 1; return { k: 'cycle', c, d: di - cyStart(c) + 1 }; }
  if (di <= RACE_DI) return { k: 'race', d: di - RACEWEEK_DI + 1 };
  return { k: 'post' };
}

const ETAPAS = [
  { n: 1, name: 'Base', cs: [1, 3], focus: [60, 30, 10],
    obj: 'Llegar sin lesiones, no rápido. Tendones, espinillas, técnica y empezar a colgarse de una barra.',
    consejos: ['Sube la carga poco a poco: si algo duele de forma rara, un día de descanso.', 'Navidad cae aquí (ciclos 2 y 3): el mínimo de 2 por semana es sagrado.', 'El ciclo 3 es de descarga: menos volumen, misma constancia.'],
    comida: 'Normal y a horas regulares. Proteína en cada comida (≈1,6 g/kg). Nada de dietas.' },
  { n: 2, name: 'Fuerza y volumen', cs: [4, 7], focus: [50, 35, 15],
    obj: 'Ganar músculo en todo el cuerpo, agarre y aguante en subida. Primeras negativas de dominada y 30 burpees seguidos.',
    consejos: ['Sube el peso cuando acabes todas las series con 2 repeticiones de reserva.', 'La sesión de Subida ya va con mochila: empieza con 5 kg.', 'Ciclo 7 de descarga.'],
    comida: 'Algo por encima de lo que gastas (+200–300 kcal). Proteína 1,8–2 g/kg. Dormir 7–8 h.' },
  { n: 3, name: 'Resistencia específica', cs: [8, 10], focus: [50, 25, 25],
    obj: 'Parecerse a la carrera: cuestas largas, mochila, burpees con cansancio y la primera salida a la montaña.',
    consejos: ['Semana Santa (27–28 mar): salida a la montaña, la prueba de cómo vais.', 'Entrena con las zapatillas de trail de la carrera.', 'Ciclo 10 de descarga para recuperar de la montaña.'],
    comida: 'Come lo que gastas. Carbohidratos altos el día antes y el de la tirada larga. Practica comer y beber en salidas de más de 90 min.' },
  { n: 4, name: 'Pico', cs: [11, 12], focus: [55, 15, 30],
    obj: 'Máximo volumen del plan y simulacro en montaña el 15 de mayo.',
    consejos: ['Simulacro sáb 15 may: misma ropa, zapatillas, comida y bebida que el día de la carrera.', 'Si aparece un dolor raro: descanso y fisio, no aprietes.'],
    comida: 'Carbohidratos altos los días largos, sodio y agua. Prueba el gel y la bebida isotónica de la carrera.' },
  { n: 5, name: 'Afinado', cs: [13, 13], focus: [65, 20, 15],
    obj: 'Bajar volumen un 40 %, mantener algo de intensidad y llegar fresco.',
    consejos: ['Nada nuevo: ni zapatillas, ni comida, ni ejercicios.', 'Semana de carrera (31 may – 5 jun): solo soltar piernas.'],
    comida: 'Los 2–3 últimos días más carbohidratos, poca fibra la víspera, hidratarse y cenar pronto.' },
];
function stageOf(c) { return ETAPAS.find(e => c >= e.cs[0] && c <= e.cs[1]) || ETAPAS[4]; }
function prog(c) { let n = 0; for (let k = 1; k < c; k++) if (!DELOAD.includes(k)) n++; return n; }

const DEF = {
  G: { t5k: 1650, flex: 20, sent: 35, dom: 2, colg: 30, plan: 60, burp: 120, dp: 250 },
  B: { t5k: 1800, flex: 15, sent: 30, dom: 1, colg: 25, plan: 45, burp: 140, dp: 220 },
};

/* ===== Formatos ===== */
function fmt(s) {
  if (s == null || isNaN(s)) return '–';
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function parseT(str) {
  if (typeof str !== 'string') return null;
  let s = str.trim();
  if (/^\d{3,6}$/.test(s)) { // solo cifras: 630 = 6:30, 2730 = 27:30, 12730 = 1:27:30
    const l = s.slice(-2), r = s.slice(0, -2);
    s = r.length > 2 ? r.slice(0, -2) + ':' + r.slice(-2) + ':' + l : r + ':' + l;
  } else s = s.replace(/[.,;\s]+/g, ':'); // 6.30, 6,30 y 6 30 también valen
  const p = s.split(':').map(x => x.trim());
  if (p.length < 2 || p.length > 3 || p.some(x => !/^\d+$/.test(x))) return null;
  const n = p.map(Number);
  if (n[n.length - 1] > 59) return null;
  return p.length === 2 ? n[0] * 60 + n[1] : n[0] * 3600 + n[1] * 60 + n[2];
}
const TIME_M = ['pace', 'rep', 'time'];
function pct(m, tgt, v) {
  if (v == null || tgt == null || typeof v !== 'number') return null;
  return TIME_M.includes(m) ? (tgt - v) / tgt : (v - tgt) / tgt;
}
function fmtVal(m, v) {
  if (v == null) return '–';
  if (m === 'pace') return fmt(v) + '/km';
  if (m === 'rep') return fmt(v) + ' por serie';
  if (m === 'time') return fmt(v);
  if (m === 'dplus') return v + ' m';
  return String(v);
}

/* ===== Parámetros de cada uno (de la semana de prueba) ===== */
function params(p, doc) {
  const o = Object.assign({}, DEF[p]);
  const L = (doc && doc.log) || {};
  if (L['t:t1'] && typeof L['t:t1'].v === 'number') o.t5k = L['t:t1'].v;
  if (L['t:t2'] && L['t:t2'].v && typeof L['t:t2'].v === 'object') {
    for (const k of ['flex', 'sent', 'dom', 'colg', 'plan', 'burp']) {
      const x = L['t:t2'].v[k];
      if (typeof x === 'number' && x >= 0) o[k] = x;
    }
  }
  if (L['t:t3'] && typeof L['t:t3'].v === 'number') o.dp = L['t:t3'].v;
  o.real = { t5k: !!L['t:t1'], fuerza: !!L['t:t2'], dp: !!L['t:t3'] };
  return o;
}
function paceP(pr, c) { return Math.round(pr.t5k / 5) - Math.min(26, 2 * (c - 1)); }

/* ===== Semana de prueba ===== */
const TESTS = ['t1', 't2', 't3'];
const TEST_DAYS = { t1: 1, t2: 3, t3: 6 };
function T(sid) {
  if (sid === 't1') return { sid, n: 'Test 5 km', k: 'Prueba', mn: 40, m: 'time', tgt: null, unit: 'tiempo total (m:ss)',
    cal: '10 min de trote muy suave + movilidad de tobillos y cadera + 3 progresivos de 80 m.',
    main: ['5 km a tope pero REGULAR: el primer km no más rápido que el resto.', 'Llano: pista, parque o cinta al 1 %.', 'Apunta el tiempo total. De aquí salen todos tus ritmos.'],
    cool: '10 min andando + estirar gemelos, cuádriceps e isquios.', eff: '9/10' };
  if (sid === 't2') return { sid, n: 'Test de fuerza', k: 'Prueba', mn: 45, m: 'multi', tgt: null, unit: 'marcas',
    cal: '5 min de trote o comba, círculos de brazos, 10 sentadillas, 5 flexiones suaves.',
    main: ['Flexiones máximas seguidas (pecho al suelo, cuerpo recto). Descanso 3 min.', 'Sentadillas en 1 minuto (muslo paralelo al suelo). Descanso 3 min.', 'Dominadas máximas (si 0, pon 0). Descanso 3 min.', 'Colgado en barra: segundos máximos. Descanso 3 min.', 'Plancha: segundos máximos. Descanso 3 min.', '30 burpees contra reloj (pecho al suelo y salto).'],
    cool: '6 min de estiramientos de hombros, pecho y piernas.', eff: '9/10' };
  return { sid, n: 'Test de subida', k: 'Prueba', mn: 50, m: 'dplus', tgt: null, unit: 'metros subidos en 30 min',
    cal: '10 min andando rápido o trote suave.',
    main: ['30 min subiendo SIN PARAR al ritmo más fuerte que puedas mantener.', 'Cinta: pendiente 10–15 %, andando rápido (la cinta te da los metros).', 'Escaleras: cuenta pisos (1 piso ≈ 3 m).', 'Cuesta: repite la cuesta y mide con el reloj o el móvil.', 'Si podéis ir al monte, mejor: apunta el desnivel en 30 min de subida.'],
    cool: 'Baja andando con control + estirar gemelos y cuádriceps.', eff: '8/10' };
}

/* ===== Semana de carrera ===== */
const RSIDS = ['r1', 'r2', 'r3'];
const R_DAYS = { r1: 1, r2: 3, r3: 4 };
function RS(sid) {
  if (sid === 'r1') return { sid, n: 'Rodaje suave', k: 'Cardio', mn: 30, m: 'none', unit: '',
    cal: '5 min andando.', main: ['25 min de trote muy suave, sin mirar el ritmo.'], cool: 'Estirar suave.', eff: '3/10' };
  if (sid === 'r2') return { sid, n: 'Activación', k: 'Híbrido', mn: 30, m: 'none', unit: '',
    cal: '10 min de trote suave.', main: ['4 × 1 min de cuesta a ritmo vivo, bajando andando.', '10 burpees tranquilos y 2 × 15 s colgado.'], cool: '5 min andando.', eff: '5/10' };
  return { sid, n: 'Soltar piernas', k: 'Cardio', mn: 20, m: 'none', unit: '',
    cal: '—', main: ['15 min de trote muy suave + movilidad.', 'Prepara la mochila de la carrera.'], cool: '—', eff: '2/10' };
}

/* ===== Ajuste automático según lo que vais haciendo ===== */
// Esfuerzo esperado por sesión (1–10): sirve para no premiar ir rápido reventado.
const EXP_R = { s1: [4, 6], s3: [7, 9], s7: [5, 7], s2: [6, 8], s4: [6, 8], s5: [7, 9], s6: [6, 8] };
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function emptyAdapt() { return { adj: 0, f: { s2: 1, s4: 1, s5: 1, s6: 1 }, n: 0, last: null }; }
const _tl = new WeakMap();
// Recorre los registros en orden y guarda el estado de ajuste ANTES de cada uno,
// así el objetivo de una sesión ya hecha no cambia después.
function timeline(p, doc) {
  if (doc && typeof doc === 'object' && _tl.has(doc)) return _tl.get(doc);
  const L = (doc && doc.log) || {}, recs = [];
  for (const k of Object.keys(L)) {
    const r = L[k];
    if (k[0] === 'c' && r && !r.canje && typeof r.v === 'number' && typeof r.di === 'number') recs.push({ k, r });
  }
  recs.sort((a, b) => a.r.di - b.r.di || (a.r.ts || 0) - (b.r.ts || 0));
  const s = emptyAdapt(), before = {};
  for (const { k, r } of recs) {
    before[k] = JSON.parse(JSON.stringify(s));
    const [a, sid] = k.split(':'), c = +a.slice(1);
    if (!(c >= 1 && c <= NCYC) || !SIDS.includes(sid)) continue;
    const ses = S(c, sid, p, doc, before[k]);
    if (ses.tgt == null || ses.special) continue;
    const e = EXP_R[sid] || [6, 8], eff = typeof r.r === 'number' ? r.r : (e[0] + e[1]) / 2;
    if (ses.m === 'pace' || ses.m === 'rep') {
      let d = r.v - ses.tgt;
      if (ses.m === 'rep') d = d / ses.repKm;
      d = clamp(d, -40, 40);
      if (d < 0 && eff > e[1] + 1) d *= 0.3;         // más rápido pero reventado: cuenta poco
      if (d > 0 && eff <= e[0] - 1) d *= 0.5;         // más lento pero muy suave: igual fue a propósito
      if (d < 0 && r.km && ses.km && r.km < ses.km * 0.85) d = 0; // más rápido pero con menos km: no cuenta
      s.adj = clamp(s.adj + 0.35 * d, -30, 45);
      s.last = { sid, c, d: Math.round(d) };
    } else if (s.f[sid] != null && ses.m !== 'none') {
      let ratio = r.v / ses.tgt;
      if (ratio > 1 && eff >= e[1] + 1) ratio = 1;    // lo sacaste pero al límite: no sube
      s.f[sid] = clamp(s.f[sid] * clamp(1 + 0.5 * (ratio - 1), 0.9, 1.1), 0.7, 1.6);
      s.last = { sid, c, ratio };
    }
    s.n++;
  }
  const out = { before, final: s };
  if (doc && typeof doc === 'object') _tl.set(doc, out);
  return out;
}

/* ===== Las 7 sesiones del ciclo ===== */
function S(c, sid, p, doc, ad) {
  if (!ad) { const tl = timeline(p, doc); ad = tl.before['c' + c + ':' + sid] || tl.final; }
  const fx = k => (ad.f && ad.f[k]) || 1;
  const pr = params(p, doc), st = stageOf(c).n, dl = DELOAD.includes(c), g = prog(c), P = paceP(pr, c) + Math.round(ad.adj || 0), B = p === 'B';
  const kgMochila = st === 1 ? 0 : st === 2 ? 5 : 8;
  let o;
  if (sid === 's1') {
    const km = [3, 3.5, 3, 4, 4.5, 5, 4, 5, 5.5, 4.5, 6, 6, 4][c - 1];
    const tgt = P + 65;
    o = { n: 'Carrera suave', k: 'Cardio', m: 'pace', tgt, km, unit: 'ritmo medio por km (m:ss)', mn: Math.round(km * tgt / 60) + 17,
      cal: '5 min andando rápido + 3 min de trote muy suave. Movilidad: 10 círculos de tobillo y cadera por lado y 10 balanceos de pierna.',
      main: [`${String(km).replace('.', ',')} km seguidos a ${fmt(tgt)}/km.`, 'Ritmo de charla: si no puedes decir frases enteras, afloja.', 'Zancada corta, hombros sueltos, mirada al frente.',
        st >= 3 ? 'Busca un recorrido con alguna cuesta y súbela sin parar.' : 'Si puedes, por tierra o parque (menos impacto).',
        ...(st >= 2 && st <= 4 ? ['Al acabar, sin descansar: 3 colgados al máximo en una barra de parque (agarre con las piernas cansadas, como en carrera).'] : [])],
      cool: '5 min andando + estirar gemelos, cuádriceps e isquios (30 s por grupo).', eff: '4–5/10' };
  } else if (sid === 's2') {
    const sets = dl ? 3 : st === 5 ? 2 : 4;
    const hg = Math.max(10, Math.round(Math.min(60, Math.round(pr.colg * 0.6) + 3 * g) * fx('s2')));
    const tiron = st === 1 ? ['Remo invertido bajo una mesa o barra baja 3×8 (cuerpo recto), 75 s.']
      : st === 2 ? ['Dominadas negativas 4×3: subir con salto y bajar en 4 s, 90 s.']
      : [`Dominadas ${Math.max(3, pr.dom + 2)} series al máximo (si no salen, negativas), 2 min.`, 'Colgado con toalla 3×15 s (simula la cuerda), 60 s.'];
    const main = [`Colgado activo en barra ${sets}×${hg} s: hombros abajo, sin balancearse. Descanso 90 s.`, ...tiron,
      'Remo con mancuerna o mochila 4×10 por lado, 75 s.', 'Curl de bíceps 3×12, 60 s (la cuerda y las cargas lo agradecen).',
      `Peso muerto rumano 3×10 con ${st === 1 ? 'mancuernas o mochila' : 'mochila de 10–12 kg o mancuernas'}, 90 s.`];
    if (st >= 2) main.push('Bajar del escalón LENTO (3 s) 3×8 por pierna: prepara las bajadas.');
    main.push(st >= 3 ? 'Hollow hold 3×20 s.' : 'Dead bug 3×8 por lado.', `Agarre final: paseo del granjero 3×30 m con ${st === 1 ? (B ? 8 : 10) : st === 2 ? (B ? 12 : 15) : (B ? 15 : 20)} kg por mano (o garrafas).`);
    o = { n: 'Fuerza A · espalda, bíceps y agarre', k: 'Fuerza', m: 'reps', tgt: sets * hg, unit: 'segundos totales colgado', mn: 55,
      cal: '5 min de remo, bici o trote suave, círculos de brazos, 2×12 aperturas con goma, 2×5 colgados de 10 s.',
      main, cool: '6 min de estiramientos: dorsales, bíceps, antebrazos (muñecas arriba y abajo), isquios.', eff: '7/10 con 2 repeticiones en reserva' };
  } else if (sid === 's3') {
    if (st === 1) {
      const n = { 1: 5, 2: 6, 3: 4 }[c], tgt = Math.round((P - 15) * 0.4);
      o = { n: `Series ${n}×400 m`, k: 'Cardio', m: 'rep', tgt, repKm: 0.4, unit: 'tiempo medio por serie (m:ss)', mn: 45,
        cal: '10 min de trote suave, 3 progresivos de 80 m, skipping y talones al glúteo 2×20 m.',
        main: [`${n}×400 m en ${fmt(tgt)} cada una. Recuperación 90 s andando.`, 'La última igual de rápida que la primera, no más.', 'Pista, parque llano o cinta al 1 %.'],
        cool: '8 min de trote muy suave + estirar gemelos y cadera.', eff: '8/10. Si la 3.ª ya revienta, saliste demasiado rápido.' };
    } else if (st === 2) {
      const n = { 4: 4, 5: 5, 6: 6, 7: 3 }[c], tgt = Math.round((P - 10) * 0.8);
      o = { n: `Series ${n}×800 m`, k: 'Cardio', m: 'rep', tgt, repKm: 0.8, unit: 'tiempo medio por serie (m:ss)', mn: 50,
        cal: '10 min de trote suave, 3 progresivos de 80 m, skipping 2×20 m.',
        main: [`${n}×800 m en ${fmt(tgt)} cada una. Recuperación 2 min trotando muy suave.`, 'Ritmo constante: mejor quedarse corto en la primera.'],
        cool: '8 min de trote muy suave + estirar.', eff: '8/10' };
    } else if (st <= 4) {
      const [n, mins] = { 8: [4, 3], 9: [5, 3], 10: [3, 3], 11: [5, 4], 12: [6, 4] }[c];
      o = { n: `Cuestas largas ${n}×${mins} min`, k: 'Cardio y piernas', m: 'reps', tgt: n, unit: 'cuestas completadas sin parar', mn: 55,
        cal: '10 min de trote suave hasta la cuesta + 3 progresivos cortos.',
        main: [`${n} subidas de ${mins} min a esfuerzo fuerte y constante (cuesta o cinta al 6–10 %).`, 'Si la pendiente es fuerte, sube andando rápido con manos en los muslos: es lo que harás en Andorra.', 'Baja trotando suave y controlando: rodillas flexionadas, paso corto.'],
        cool: '10 min de trote suave + estirar gemelos y cuádriceps.', eff: '8/10 en las subidas' };
    } else {
      o = { n: 'Cambios de ritmo 6×1 min', k: 'Cardio', m: 'reps', tgt: 6, unit: 'cambios completados', mn: 35,
        cal: '10 min de trote suave.', main: ['6×1 min a ritmo vivo (no a tope), 2 min de trote suave entre medias.'],
        cool: '8 min de trote suave.', eff: '6–7/10' };
    }
  } else if (sid === 's4') {
    const Dt = { 1: 200, 2: 250, 3: 180, 4: 300, 5: 350, 6: 400, 7: 300, 8: 500, 9: 900, 10: 450, 11: 700, 12: 800, 13: 400 }[c];
    if (c === 9) {
      const tgt = Math.round(Dt * (B ? 0.9 : 1) / 50) * 50;
      o = { n: 'Montaña · Semana Santa', k: 'Montaña', m: 'dplus', tgt, unit: 'metros de desnivel positivo', mn: 180, special: true,
        cal: 'Desayuno con carbohidratos 2 h antes. 10 min andando suave antes de la primera subida.',
        main: [`Ruta de ≈3 h con +${tgt} m (o lo más cerca que encontréis).`, 'Llano y bajadas corriendo suave; subidas andando FUERTE sin pararos.', 'Practicad las bajadas: rodillas flexionadas, paso corto, mirada 3 m por delante.', '30 burpees en la cima.', 'Comer algo cada 45 min y beber cada 20 min. Zapatillas de trail.'],
        cool: '10 min andando + estirar. Apunta cómo han ido las bajadas.', eff: '7/10 de media' };
    } else {
      const tgt = Math.round(Dt * pr.dp / 250 * fx('s4') / 10) * 10;
      const moch = kgMochila ? ` con mochila de ${B ? kgMochila - 1 : kgMochila} kg` : '';
      o = { n: 'Subida', k: 'Cardio y piernas', m: 'dplus', tgt, unit: 'metros subidos', mn: Math.round(tgt / 10) + 20,
        cal: '8 min andando rápido o trote suave + movilidad de tobillos.',
        main: [`+${tgt} m de subida${moch}, en el sitio que tengas:`, '· Cinta: 10–15 % de pendiente, andando rápido (30 min al 12 % a 5 km/h ≈ 300 m).', '· Escaleras: cuenta pisos (1 piso ≈ 3 m). Baja también por las escaleras, controlando.', '· Cuesta larga: súbela entera, baja trotando suave.',
          st >= 3 ? '30 burpees al terminar la última subida.' : 'Paso corto y braceo activo.', 'En cinta no hay bajada: acaba con 3×10 bajadas lentas de escalón por pierna.'],

const RACE_TS = Date.UTC(2027, 5, 5, 7, 0); // sáb 5 jun 2027, 9:00 en Andorra (hora de salida aproximada)
function countdownParts() {

}

  return `<div class="cd-l">Faltan</div>${b(c.d, c.d === 1 ? 'día' : 'días')}${b(String(c.h).padStart(2, '0'), 'horas')}${b(String(c.mi).padStart(2, '0'), 'min')}`;
}
function countdownHtml() { return `<div class="cd" id="cd">${countdownInner()}</div>`; }
setInterval(() => { const el = document.getElementById('cd'); if (el) el.innerHTML = countdownInner(); }, 15000);

function signed(n) { return n > 0 ? '+' + n : String(n); }
function totalsUpTo(p, cmax) { let at = 0, ex = 0; for (let c = 1; c <= cmax; c++) { const s = cycleStat(p, c, docs[p]); at += s.atrasos; ex += s.extras; } return { at, ex }; }

    <div class="sc-r">${tag}<span class="chev">${open ? '−' : '+'}</span></div></div>`;
  let bodyH = '';

    const full = `<div class="blk"><div class="bt">Calentamiento</div><p>${ses.cal}</p></div>

/* ===== Opcional ===== */
function opcLastDays(sid) {
  const t = todayDi(); let best = 99;
  for (let c = 1; c <= NCYC; c++) {
    const r = (docs[st.me].log || {})['c' + c + ':' + sid]; if (r && typeof r.di === 'number') best = Math.min(best, t - r.di);
  }
  for (const e of (docs[st.me].extras || [])) if (e.k === sid && typeof e.di === 'number') best = Math.min(best, t - e.di);
  return best;
}
function opcionalView() {

    const body = `${acc('of:' + x.sid, 'Ver la sesión', '', full, false)}

      <div class="err">${esc((st.err.opt && st.err.opt[x.sid]) || '')}</div>

function curAtrasos(p) { const ph = phase(todayDi()); return ph.k === 'cycle' ? totalsUpTo(p, ph.c).at : 0; }
function checkRival() {
  if (!st.me || LOCAL || !loaded.G || !loaded.B) return;
  const me = st.me, ot = OTHER[me], doc = docs[ot] || {}, L = doc.log || {}, now = Date.now();
  const sk = 'spartan_seen_' + me, seen = lsGet(sk, null);
  if (seen === null) { lsSet(sk, now); lsSet('spartan_at_' + me, curAtrasos(ot)); return; }
  const recs = [];
  for (const k of Object.keys(L)) { const r = L[k]; if (r && typeof r.ts === 'number') recs.push({ k, r }); }
  for (const e of (doc.extras || [])) if (e && typeof e.ts === 'number') recs.push({ k: 'extra', r: e });
  let added = false;
  recs.filter(x => x.r.ts > seen && x.r.ts > now - 3 * DAY).sort((a, b) => a.r.ts - b.r.ts).slice(-3).forEach(x => {
    const id = 'd' + x.r.ts;
    if (st.evs.some(e => e.id === id)) return;
    let txt;
    if (x.k === 'extra') txt = x.r.opt ? `${NAMES[ot]} ha hecho un opcional (${LVN[x.r.opt]}).` : `${NAMES[ot]} ha apuntado una sesión extra.`;
    else {
      const ses = sessionFor(ot, x.k);
      if (x.r.canje) txt = `${NAMES[ot]} ha canjeado ${ses.n} por ${x.r.canje.dep}.`;
      else {
        const h = typeof x.r.v === 'number' && ses.tgt != null ? pct(ses.m, ses.tgt, x.r.v) : null;
        txt = `${NAMES[ot]} acaba de hacer ${ses.n}${h == null ? '' : ' (' + (h >= 0 ? '+' : '') + Math.round(h * 100) + ' % sobre su objetivo)'}.`;
      }
    }
    st.evs.push({ id, kind: 'done', txt }); added = true;
  });
  const at = curAtrasos(ot), prev = lsGet('spartan_at_' + me, 0);
  if (at > prev && !st.evs.some(e => e.id === 'late' + at)) { st.evs.push({ id: 'late' + at, kind: 'late', txt: `${NAMES[ot]} va atrasado: ${at} atraso${at === 1 ? '' : 's'} acumulado${at === 1 ? '' : 's'}.` }); added = true; }
  if (at !== prev) lsSet('spartan_at_' + me, at);
  if (added) render();
}

/* ===== Eventos ===== */
document.addEventListener('click', e => {

    st.err.opt = {}; const lvl = st.optLv, di = todayDi(), c = ph.c;
    mutate(d => { d.extras = d.extras || []; d.extras.push({ c, di, k: v, r, ts: Date.now(), opt: lvl }); });
    toast('Opcional apuntada (+5).'); celebrate('¡Opcional hecha!', LVN[lvl] + ' · +5 puntos');
  }
  else if (act === 'menu') { st.menu = !st.menu; render(); }
  else if (act === 'tab') { st.menu = false; st.tab = v; st.enter = true; st.open = null; if (v !== 'plan') { st.who = null; st.pv = null; } render(); window.scrollTo(0, 0); }
  else if (act === 'toggle') { const k = el.dataset.k; st.open = el.dataset.o === '1' ? 'x' + k : k; render(); }
  else if (act === 'pv') { st.pv = +v; st.open = null; render(); }
  else if (act === 'who') { st.who = v; st.open = null; render(); }
  else if (act === 'seeRival') { st.tab = 'plan'; st.who = OTHER[st.me]; st.pv = null; render(); window.scrollTo(0, 0); }
  else if (act === 'mv') { st.mv = v; render(); }
  else if (act === 'pacesid') { st.paceSid = v; render(); }
  else if (act === 'openst') { st.openSt = st.openSt === +v ? -1 : +v; render(); }
  else if (act === 'savenote') { const k = el.dataset.k, ta = document.getElementById('note-' + k); saveNote(st.me + '|' + k, ta ? ta.value.trim().slice(0, 2000) : ''); toast('Nota guardada (privada).'); }
  else if (act === 'delrec') { const k = el.dataset.k; if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '¿Seguro? Toca otra vez'; return; } mutate(d => { if (d.log) delete d.log[k]; }); toast('Registro borrado.'); }
  else if (act === 'delextra') { if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = '¿Seguro?'; return; } mutate(d => { d.extras = (d.extras || []).filter(x => String(x.ts) !== v); }); }
  else if (act === 'picar') { mutate(d => { d.pique = { ts: Date.now(), txt: PIQUES[+v] }; }); toast('Picado. Lo verá al abrir la web.'); }
  else if (act === 'eff') { const i = document.getElementById(el.dataset.id); if (i) { i.value = v; el.parentNode.querySelectorAll('.ef').forEach(b => b.classList.toggle('on', b === el)); } }
  else if (act === 'evok') { st.evs = st.evs.filter(e => String(e.id) !== v); lsSet('spartan_seen_' + st.me, Date.now()); render(); }
  else if (act === 'pqseen') { lsSet('spartan_pq_' + st.me, +v); render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'setday') {
    const [a, sid] = el.dataset.k.split(':'), c = a.slice(1);
    mutate(d => { d.days = d.days || {}; d.days['c' + c] = d.days['c' + c] || {}; d.days['c' + c][sid] = +el.value; });
  } else if (el.dataset.act === 'canjedep') { st.canjeDep = el.value; st.err.canje = ''; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, val = id => { const x = document.getElementById(id); return x ? x.value.trim() : ''; };
  if (kind === 'login') {
    const pin = val('pin');
    if (pin === PINS[st.loginSel]) { st.me = st.loginSel; st.err.login = ''; lsSet('spartan_me', st.me); st.tab = 'hoy'; st.enter = true; render(); checkRival(); }
    else { st.err.login = 'PIN incorrecto.'; render(); }
    return;
  }
  if (kind === 'reg') {
    const k = f.dataset.k, ses = sessionFor(st.me, k), di = +val('d-' + k), r = +val('r-' + k);
    let v = null, err = '';
    if (ses.m === 'pace' || ses.m === 'rep' || ses.m === 'time') { v = wv('v-' + k); if (v == null || v <= 0) err = 'Elige el tiempo con la rueda.'; }
    else if (ses.m === 'reps' || ses.m === 'dplus') { const s = val('v-' + k); v = s === '' ? NaN : Math.round(+s); if (!(v >= 0) || v > 20000) err = 'Pon un número válido.'; }
    else if (ses.m === 'multi') {
      v = {}; for (const x of ['flex', 'sent', 'dom', 'colg', 'plan']) { const s = val('v-' + k + '-' + x); const n = s === '' ? NaN : Math.round(+s); if (!(n >= 0) || n > 1000) err = 'Rellena todas las marcas con números.'; v[x] = n; }
      const bt = wv('v-' + k + '-burp'); if (bt == null || bt <= 0) err = err || 'Elige el tiempo de los 30 burpees con la rueda.'; v.burp = bt;
    }
    if (!err && !(r >= 1 && r <= 10)) err = 'Elige el esfuerzo';
    if (!err && isNaN(di)) err = 'Elige la fecha.';
    if (err) { st.err[k] = err; render(); return; }
    st.err[k] = '';
    const noteEl = document.getElementById('note-' + k); const nt = noteEl ? noteEl.value.trim().slice(0, 2000) : '';
    if (nt !== (notes[st.me + '|' + k] || '')) saveNote(st.me + '|' + k, nt);
    let km = null;
    if (ses.m === 'pace' && ses.km) { const ks = val('km-' + k).replace(',', '.'); if (ks !== '') { km = +ks; if (!(km > 0 && km < 100)) { st.err[k] = 'Los km tienen que ser un número (por ejemplo 4,5).'; render(); return; } } }
    const prevAdj = timeline(st.me, docs[st.me]).final.adj;
    mutate(d => { d.log = d.log || {}; d.log[k] = km ? { di, v, r, km, ts: Date.now() } : { di, v, r, ts: Date.now() }; });
    const after = k[0] === 'c' ? cycleStat(st.me, +k.split(':')[0].slice(1), docs[st.me]) : null;
    const it = after && after.items.find(i => i.kind === 'plan' && i.sid === k.split(':')[1]);
    let msg = it && !it.counts ? 'Guardada como extra (ya tenías 5 esa semana).' : '¡Sesión guardada! 💪';
    if (ses.m === 'pace' || ses.m === 'rep') {
      const na = timeline(st.me, docs[st.me]).final.adj, dd = Math.round(na - prevAdj);
      if (dd) msg += ` Tus próximos ritmos ${dd < 0 ? 'bajan' : 'suben'} ${Math.abs(dd)} s/km.`;
    } else if (k[0] === 'c' && ses.m !== 'none') msg += ' Tus próximos objetivos se han ajustado.';
    toast(msg);
    const h2 = it ? hitOf(st.me, +k.split(':')[0].slice(1), it, docs[st.me]) : null, hit = h2 !== null && h2 >= 0;
    if (k[0] === 'c') celebrate(it && !it.counts ? '¡Extra apuntado!' : '¡Sesión hecha!', it && !it.counts ? '+5 puntos' : '+' + (10 + (hit ? 3 : 0)) + ' puntos' + (hit ? ' · objetivo cumplido' : ''));
    else celebrate('¡Hecho!', '+10 puntos');
    return;
  }
  if (kind === 'extra') {
    const c = +f.dataset.c, r = +val('ex-r'), di = +val('ex-d'), kk = val('ex-k');
    if (!(r >= 1 && r <= 10)) { st.err.extra = 'Elige el esfuerzo'; render(); return; }
    st.err.extra = '';
    mutate(d => { d.extras = d.extras || []; d.extras.push({ c, di, k: kk, r, ts: Date.now() }); });
    toast('Extra apuntado (+5).'); celebrate('¡Extra apuntado!', '+5 puntos'); return;
  }
  if (kind === 'canje') {
    const c = +f.dataset.c, dep = CANJES.find(x => x.d === (st.canjeDep || CANJES[0].d)), sid = val('cj-s'), m = +val('cj-m'), di = +val('cj-d'), r = +val('cj-r');
    const wOf = x => (x - cyStart(c) < 7 ? 0 : 1);
    const used = SIDS.some(s2 => { const rr = recOf(st.me, 'c' + c + ':' + s2); return rr && rr.canje && wOf(rr.di) === wOf(di); });
    let err = '';
    if (used) err = 'Ya has usado el canje de esa semana.';
    else if (!(m >= dep.min)) err = `${dep.d} necesita al menos ${dep.min} min.`;
    else if (!(r >= 1 && r <= 10)) err = 'Elige el esfuerzo';
    if (err) { st.err.canje = err; render(); return; }
    st.err.canje = '';
    mutate(d => { d.log = d.log || {}; d.log['c' + c + ':' + sid] = { di, v: null, r, ts: Date.now(), canje: { dep: dep.d, min: Math.round(m) } }; });
    toast('Canje guardado (+7).'); celebrate('¡Canje guardado!', '+7 puntos');
  }
});

/* ===== Arranque ===== */
(function boot() {
  const me = lsGet('spartan_me', null);
  if (me === 'G' || me === 'B') st.me = me;
  render();
  initDb();
})();


</script>
